    <section>
        <h2  align="center"> ORDER CARD</h2>
        <table border="1" >
            <tr>
                <th  hight="500" weight="600">
                    <div id="droptarget" ondrop="drop(event)" ordragover="allowDrop(event)" ></div>
                </th>
            </tr>
        </table>
    </section>

    <script>
        function drag(ev){
            ev.dataTransfer.setData('text',ev.target.id);
        }
        function allowDrop(ev){
            ev.preventDefault();
        }
        function drop(ev){
            ev.preventDefault();
            const data=ev.dataTransfer.getData('text').dropEffect ='copy';
            ev.target.appendChild(document.getElementById(data));
        }
        
    </script>
