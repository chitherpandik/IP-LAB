<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <section>

        <h2 align="center">CUSTOMER DETAILS</h2>

        <center>

            <form action="index.php" method="post">

                <label>Name:</label>

                <input type="text"
                       name="name"
                       required>

                <br><br>


                <label>Email:</label>

                <input type="email"
                       name="email"
                       required>

                <br><br>


                <label>Phone:</label>

                <input type="text"
                       name="phone"
                       required>

                <br><br>


                <label>Address:</label>

                <textarea name="address"
                          rows="3"
                          cols="30"
                          required>
                </textarea>

                <br><br>


                <label>Order Price:</label>

                <input type="number"
                       name="price"
                       placeholder="Enter price"
                       required>

                <br><br>


                <label>Payment:</label>

                <input type="radio"
                       name="payment"
                       value="Cash"
                       required>

                Cash

                <input type="radio"
                       name="payment"
                       value="UPI">

                UPI

                <br><br>


                <input type="submit"
                       value="Place Order">

                &nbsp;&nbsp;

                <input type="reset"
                       value="Reset">

            </form>

        </center>

    </section>
    </body>
