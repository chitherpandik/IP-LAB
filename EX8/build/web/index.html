<html>
    <head>
        <title>User Registration</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body >
        <H2>USER REGISTRATION FORM</H2>
        <form action="process.jsp" method="post" algin="center">
            User Name:
            <input type="text" name="username" required placeholder="Enter the UserName"><br><br>
            Phone Number:
            <input type="number" name="phone" required placeholder="Enter the Phone Number"><br><br>
            Credit Card Number:
            <input type="number" name="ccn" required placeholder="Enter the Credit card Number"><br><br>
            Email:
            <input type="email" name="email" required><br><br>
            Password :
            <input type="password" name="password" required placeholder="Enter the Password"><br><br>
            <input type="submit" value="SUBMIT">
            <input type="reset" value="RESET">
            
            
            
        
        
    </body>
</html>
